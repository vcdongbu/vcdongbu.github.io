<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김해 동부배구클럽 여자팀 아카이브</title>
    <!-- 디자인 툴 (Tailwind) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CSV 파싱 도구 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- 1. 입장 코드 화면 -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-blue-900">
        <div class="bg-white p-8 rounded-lg shadow-xl text-center w-11/12 max-w-sm">
            
            <div class="mb-8 select-none">
                <div class="flex flex-col items-center justify-center">
                    <span class="text-6xl font-black tracking-tighter text-blue-900 leading-none" style="font-family: 'Arial Black', Impact, sans-serif;">DONGBU</span>
                    <div class="w-full border-t-[4px] border-blue-900 mt-2 mb-1.5"></div>
                    <span class="text-[0.65rem] sm:text-xs font-bold tracking-[0.25em] text-blue-900 ml-1">WOMEN'S VOLLEYBALL CLUB</span>
                </div>
            </div>

            <p class="text-sm text-gray-500 mb-6">프라이빗 아카이브 입장 코드를 입력하세요.</p>
            <input type="password" id="password-input" class="w-full border p-3 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" placeholder="입장 코드를 입력하세요" onkeypress="if(event.key === 'Enter') checkPassword()">
            <button onclick="checkPassword()" class="w-full bg-blue-900 text-white p-3 rounded font-bold hover:bg-blue-800 transition">입장하기</button>
        </div>
    </div>

    <!-- 2. 메인 화면 -->
    <div id="main-screen" class="hidden min-h-screen pb-10">
        <header class="bg-blue-900 text-white p-4 sticky top-0 z-10 shadow-md">
            <h1 class="text-xl font-bold text-center tracking-wide">🏐 DONGBU ARCHIVE</h1>
        </header>

        <!-- 카테고리 탭 -->
        <div class="flex justify-center bg-white shadow-sm mb-4 text-sm sm:text-base">
            <button id="tab-대회영상" onclick="filterCategory('대회영상')" class="tab-btn flex-1 py-3 font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none">대회영상</button>
            <button id="tab-친선경기" onclick="filterCategory('친선경기')" class="tab-btn flex-1 py-3 font-semibold text-gray-500 hover:text-blue-600 focus:outline-none">친선경기</button>
            <button id="tab-연습영상" onclick="filterCategory('연습영상')" class="tab-btn flex-1 py-3 font-semibold text-gray-500 hover:text-blue-600 focus:outline-none">연습영상</button>
            <button id="tab-가이드" onclick="filterCategory('가이드')" class="tab-btn flex-1 py-3 font-semibold text-gray-500 hover:text-blue-600 focus:outline-none">가이드</button>
        </div>

        <div id="status-message" class="text-center text-gray-500 mt-10">데이터를 불러오는 중입니다...</div>
        
        <!-- 영상 리스트 -->
        <div id="video-list" class="max-w-md mx-auto px-4 space-y-4"></div>
    </div>

    <script>
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRek-y-oVDapZn2wwNwb0L1VsYzbzY9V1qTU1H9pneHCDVKsXAgqMR3mbLUWw3U18GpTd5-XePrpsZp/pub?output=csv";
        const ENCODED_PW = "dGVhbWRi"; 
        
        let allVideos = [];

        function getYearColors(year) {
            const colors = {
                '2023': { bg: 'bg-gray-100', text: 'text-gray-600' },
                '2024': { bg: 'bg-blue-100', text: 'text-blue-600' },
                '2025': { bg: 'bg-green-100', text: 'text-green-600' },
                '2026': { bg: 'bg-purple-100', text: 'text-purple-600' },
                '2027': { bg: 'bg-pink-100', text: 'text-pink-600' }
            };
            return colors[year] || { bg: 'bg-orange-100', text: 'text-orange-600' }; 
        }

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            if (btoa(input) === ENCODED_PW) { 
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                fetchData(); 
            } else {
                alert('입장 코드가 틀렸습니다.');
            }
        }

        function fetchData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true, 
                skipEmptyLines: true,
                complete: function(results) {
                    const data = results.data;
                    
                    allVideos = data.map(row => {
                        const rawDate = (row['Date'] || row['date'] || '').trim();
                        let fullYear = '';
                        let formattedDate = '';
                        
                        if (rawDate.length === 6) {
                            fullYear = '20' + rawDate.substring(0, 2);
                            const month = rawDate.substring(2, 4);
                            const day = rawDate.substring(4, 6);
                            formattedDate = `${fullYear}.${month}.${day}`;
                        } else {
                            formattedDate = rawDate; 
                        }

                        return {
                            category: (row['Category'] || row['category'] || '').trim(),
                            rawDate: rawDate,         
                            displayDate: formattedDate, 
                            year: fullYear,           
                            opponent: (row['Opponent'] || row['opponent'] || '').trim(),
                            tournament: (row['Tournament'] || row['tournament'] || row['대회명'] || '').trim(),
                            fullVideo: (row['FullVideo'] || row['풀영상'] || '').trim(),
                            memo: (row['Memo'] || row['memo'] || row['설명'] || '').trim(),
                            // ⭐️ 에러 방지를 위해 열 이름 인식 강화 (띄어쓰기나 한글도 인식)
                            sets: [
                                row['Set1'] || row['set1'] || row['Set 1'] || row['1세트'] || '', 
                                row['Set2'] || row['set2'] || row['Set 2'] || row['2세트'] || '', 
                                row['Set3'] || row['set3'] || row['Set 3'] || row['3세트'] || '', 
                                row['Set4'] || row['set4'] || row['Set 4'] || row['4세트'] || '', 
                                row['Set5'] || row['set5'] || row['Set 5'] || row['5세트'] || ''
                            ].filter(Boolean) 
                        };
                    }).filter(v => v.rawDate); 

                    allVideos.sort((a, b) => b.rawDate.localeCompare(a.rawDate));

                    document.getElementById('status-message').classList.add('hidden'); 
                    filterCategory('대회영상'); 
                },
                error: function(err) {
                    console.error(err);
                    document.getElementById('status-message').innerHTML = '<span class="text-red-500">데이터를 불러오지 못했습니다. 인터넷 연결이나 주소를 확인해주세요.</span>';
                }
            });
        }

        function filterCategory(categoryName) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                btn.classList.add('text-gray-500');
            });
            const activeTab = document.getElementById(`tab-${categoryName}`);
            if (activeTab) {
                activeTab.classList.remove('text-gray-500');
                activeTab.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
            }

            const listContainer = document.getElementById('video-list');
            listContainer.innerHTML = ''; 

            if (categoryName === '가이드') {
                listContainer.innerHTML = `
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden mb-6">
                        <div class="bg-blue-50 border-b border-blue-100 p-4">
                            <h2 class="text-lg font-bold text-blue-900">📝 영상 등록 가이드 (관리자용)</h2>
                        </div>
                        <div class="p-5 space-y-6 text-gray-700 text-sm">
                            <div>
                                <h3 class="font-bold text-base text-gray-900 mb-2">1. 유튜브 업로드</h3>
                                <ul class="list-disc list-inside space-y-1 ml-1 text-gray-600">
                                    <li>팀 유튜브 계정으로 로그인합니다.</li>
                                    <li>영상 업로드 시 반드시 <strong class="text-red-500">『일부 공개』</strong>로 설정하세요.</li>
                                    <li>기존의 '부분공개목록' 재생목록에 추가합니다.</li>
                                </ul>
                            </div>
                            <div>
                                <h3 class="font-bold text-base text-gray-900 mb-2">2. 구글 시트 작성</h3>
                                <p class="mb-3 text-gray-600">아래 관리용 구글 시트에 접속하여 새로운 행에 데이터를 입력합니다.</p>
                                <a href="https://docs.google.com/spreadsheets/d/1Kd18kXzbSOK7jLRDuJTYdB7EMBTafQ-5kwA3d8tvPmE/edit?usp=sharing111" target="_blank" class="flex justify-center items-center bg-green-50 text-green-700 font-bold border border-green-200 py-3 rounded-lg hover:bg-green-100 transition duration-200">
                                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                    관리용 DB 시트 열기
                                </a>
                            </div>
                            <div>
                                <h3 class="font-bold text-base text-gray-900 mb-2">3. 데이터 입력 규칙</h3>
                                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-2.5">
                                    <p><strong class="text-indigo-600">Category:</strong> <span class="text-gray-600">대회영상 / 친선경기 / 연습영상</span></p>
                                    <p><strong class="text-indigo-600">Date:</strong> <span class="text-gray-600">6자리 날짜 (예: 260724)</span></p>
                                    <p><strong class="text-indigo-600">Tournament:</strong> <span class="text-gray-600">대회명 (연습영상은 훈련 그룹명)</span></p>
                                    <p><strong class="text-indigo-600">Opponent:</strong> <span class="text-gray-600">상대팀명 (연습영상은 '수비 훈련' 등 주제 입력)</span></p>
                                    <p><strong class="text-indigo-600">Memo:</strong> <span class="text-gray-600">경기/훈련 요약 코멘트</span></p>
                                    <p><strong class="text-indigo-600">FullVideo:</strong> <span class="text-gray-600">풀영상 링크</span></p>
                                    <p><strong class="text-indigo-600">Set1 ~ Set5:</strong> <span class="text-gray-600">분할된 영상 링크 (해당 칸에 각각 입력)</span></p> 
                                </div>
                            </div>
                            
                            <div class="flex items-start bg-yellow-50 text-yellow-800 p-4 rounded-lg text-xs leading-relaxed">
                                <span class="mr-2 text-lg">⚠️</span>
                                <p>구글 시트에 입력한 내용은 저장 즉시 아카이브 웹사이트에 <strong>자동으로 반영</strong>됩니다. 기존 데이터를 삭제하거나 형식을 변경하지 않도록 주의해 주세요! </p>
                            </div>
                        </div>
                    </div>
                `;
                return; 
            }

            const filtered = allVideos.filter(video => video.category === categoryName);

            if(filtered.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-gray-500 mt-10">${categoryName} 데이터가 없습니다.</p>`;
                return;
            }

            let previousYear = ''; 
            let previousTournament = ''; 

            filtered.forEach(video => {
                if (video.year && video.year !== previousYear) {
                    listContainer.innerHTML += `
                        <div class="flex items-center my-6">
                            <div class="flex-grow border-t border-gray-300"></div>
                            <span class="mx-4 text-gray-500 font-bold tracking-wide">${video.year}년</span>
                            <div class="flex-grow border-t border-gray-300"></div>
                        </div>
                    `;
                    previousYear = video.year;
                    previousTournament = ''; 
                }

                if (video.tournament !== previousTournament) {
                    if (video.tournament) { 
                        const icon = categoryName === '연습영상' ? '📋' : '🏆';
                        listContainer.innerHTML += `
                            <div class="flex items-center mt-8 mb-3 px-1">
                                <span class="text-indigo-800 font-extrabold text-lg tracking-tight">${icon} ${video.tournament}</span>
                                <div class="flex-grow border-b-2 border-indigo-200 ml-3"></div>
                            </div>
                        `;
                    }
                    previousTournament = video.tournament;
                }

                let contentHTML = '';

                if (video.memo) {
                    contentHTML += `
                        <div class="bg-indigo-50 border border-indigo-100 p-3 mb-3 rounded-md text-sm text-gray-700">
                            <strong>📝 요약:</strong> ${video.memo}
                        </div>
                    `;
                }
                
                // 1. 풀영상 버튼 생성
                if (video.fullVideo) {
                    contentHTML += `
                        <a href="${video.fullVideo}" target="_blank" class="group block bg-blue-50 border border-blue-200 p-3 mt-2 rounded-lg shadow-sm flex justify-between items-center hover:bg-blue-100 transition-all duration-200">
                            <span class="font-bold text-blue-800">🎬 풀영상 시청하기</span>
                            <span class="text-blue-600 group-hover:text-blue-800 transition">▶</span>
                        </a>
                    `;
                }

                // ⭐️ 풀영상과 세트 영상이 둘 다 있을 경우 예쁜 점선 구분선 추가
                if (video.fullVideo && video.sets.length > 0) {
                    contentHTML += `<div class="w-full border-t-2 border-gray-200 border-dashed my-4"></div>`;
                }

                const setLabel = categoryName === '연습영상' ? '번 클립' : '세트';

                // 2. 세트별(클립별) 영상 버튼 생성
                video.sets.forEach((link, index) => {
                    contentHTML += `
                        <a href="${link}" target="_blank" class="group block bg-white border border-gray-200 p-3 mt-2 rounded-lg shadow-sm flex justify-between items-center hover:border-indigo-400 hover:shadow-md hover:-translate-y-0.5 transition-all duration-200">
                            <div class="flex items-center">
                                <span class="bg-gray-100 text-gray-500 text-xs font-black px-2.5 py-1 rounded-md mr-3 group-hover:bg-indigo-500 group-hover:text-white transition-colors duration-200">${index + 1}</span>
                                <span class="font-bold text-gray-700 group-hover:text-indigo-700 transition-colors duration-200">${index + 1}${setLabel} 보기</span>
                            </div>
                            <div class="bg-gray-50 p-1.5 rounded-full group-hover:bg-indigo-50 transition-colors duration-200">
                                <span class="text-gray-300 group-hover:text-indigo-500 transition-colors duration-200 text-sm">▶</span>
                            </div>
                        </a>
                    `;
                });

                const yearColors = getYearColors(video.year);
                const titlePrefix = categoryName === '연습영상' ? '' : 'vs ';

                const cardHTML = `
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                        <details class="group">
                            <summary class="p-4 bg-white flex justify-between items-center hover:bg-gray-50 transition">
                                <div>
                                    <div class="mb-2">
                                        <span class="text-xs font-bold ${yearColors.bg} ${yearColors.text} px-2 py-1 rounded-full">${video.displayDate}</span>
                                    </div>
                                    <h3 class="text-lg font-bold text-gray-800">${titlePrefix}${video.opponent}</h3>
                                </div>
                                <span class="transition group-open:rotate-180 text-gray-400">
                                    <svg fill="none" height="24" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="24"><polyline points="6 9 12 15 18 9"/></svg>
                                </span>
                            </summary>
                            <div class="p-4 bg-gray-50 border-t border-gray-100">
                                ${contentHTML}
                            </div>
                        </details>
                    </div>
                `;
                listContainer.innerHTML += cardHTML;
            });
        }
    </script>
</body>
</html>
